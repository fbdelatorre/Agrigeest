name: AgriGest license manager Windows preparation
on:
  push:
    branches: [codex/licenciamento-planejamento]
    paths:
      - .github/workflows/license-manager-windows.yml
      - licensing-manager/**
      - licensing-server-local/**
      - scripts/*license-manager*.mjs
      - tests/licensing-control.test.mjs
      - tests/asaas.test.mjs
      - tests/checkout.test.mjs
      - tests/reconciliation.test.mjs
      - tests/subscription-changes.test.mjs
      - tests/owner-purchases.test.mjs
      - tests/license-devices.test.mjs
      - tests/license-teams.test.mjs
      - tests/team-invites.test.mjs
      - tests/checkout-navigation.test.mjs
      - src/features/licensing/**
      - src/pages/LicensePlans.tsx
      - tests/licensing-docker-pipe.test.mjs
      - tests/licensing-docker-loopback.test.mjs
      - scripts/licensing-docker-loopback.mjs
      - scripts/licensing-local.mjs
      - package-lock.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: license-manager-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    if: github.ref == 'refs/heads/codex/licenciamento-planejamento'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Check server logic and manager types
        run: |
          npm exec tsc -- -p licensing-manager/tsconfig.json --noEmit
          npm exec tsc -- -p tsconfig.app.json --noEmit
          node --test tests/licensing-control.test.mjs tests/asaas.test.mjs tests/checkout.test.mjs tests/reconciliation.test.mjs tests/subscription-changes.test.mjs tests/owner-purchases.test.mjs tests/license-devices.test.mjs tests/license-teams.test.mjs tests/team-invites.test.mjs tests/checkout-navigation.test.mjs tests/licensing-docker-loopback.test.mjs tests/licensing-docker-pipe.test.mjs
      - run: rustup default stable-msvc
      - name: Check Windows checkout URL validation
        shell: pwsh
        run: |
          $checkoutTestExe = Join-Path $env:RUNNER_TEMP 'checkout-url-tests.exe'
          rustc --test licensing-manager/src-tauri/src/checkout_url.rs -o $checkoutTestExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $checkoutTestExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run desktop:license-manager
      - run: node scripts/collect-license-manager.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AgriGest-Gestor-Licencas-PREPARACAO
          path: licensing-manager/release.local/*
          if-no-files-found: error
          retention-days: 7
