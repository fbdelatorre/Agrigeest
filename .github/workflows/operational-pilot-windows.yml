name: AgriGest operational pilot Windows
on:
  push:
    branches: [codex/licenciamento-planejamento]
    paths:
      - .github/workflows/operational-pilot-windows.yml
      - operational-pilot/**
      - scripts/build-operational-pilot-windows.mjs
      - scripts/collect-operational-pilot-installer.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operational-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    if: github.ref == 'refs/heads/codex/licenciamento-planejamento'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Verify application and licensing contracts
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json
          node --test tests/account-access.test.mjs tests/license-devices.test.mjs tests/license-teams.test.mjs tests/team-invites.test.mjs tests/writes.test.mjs
      - run: rustup default stable-msvc
      - name: Build isolated installer
        run: node scripts/build-operational-pilot-windows.mjs
      - name: Test trusted local portal destinations
        run: |
          rustc --test operational-pilot/src-tauri/src/local_portal.rs -o operational-pilot/src-tauri/target/local-portal-tests.exe
          & operational-pilot/src-tauri/target/local-portal-tests.exe
      - name: Check package isolation and collect installer
        run: node scripts/collect-operational-pilot-installer.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AgriGest-Piloto-Local-Windows-x64
          path: operational-pilot/release.local/*
          if-no-files-found: error
          retention-days: 7
