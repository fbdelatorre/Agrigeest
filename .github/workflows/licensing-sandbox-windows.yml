name: AgriGest licensing sandbox Windows

on:
  push:
    branches: [codex/licenciamento-planejamento]
    paths:
      - .github/workflows/licensing-sandbox-windows.yml
      - licensing-sandbox/**
      - scripts/build-licensing-sandbox.mjs
      - scripts/build-licensing-windows.mjs
      - scripts/package-licensing-sandbox.mjs
      - scripts/collect-licensing-installer.mjs
      - tests/licensing-sandbox.test.mjs
      - tests/licensing-lifecycle.test.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licensing-sandbox-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    if: github.ref == 'refs/heads/codex/licenciamento-planejamento'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out only the test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Verify the isolated prototype
        run: |
          npm exec tsc -- -p licensing-sandbox/tsconfig.json --noEmit
          npm run test:licenses
      - name: Select the Windows Rust toolchain
        run: rustup default stable-msvc
      - name: Build the independent test installer
        run: npm run desktop:licenses
      - name: Verify isolation and collect the installer
        run: node scripts/collect-licensing-installer.mjs
      - name: Upload installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AgriGest-Licencas-Teste-Windows-x64
          path: licensing-sandbox/release.local/*
          if-no-files-found: error
          retention-days: 7
